<script>
/* 启动自检：资源没加载出来时，别让用户对着转圈猜 */
(function () {
  function fail(reason) {
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML =
      '<div style="max-width:520px;margin:0 auto;padding:64px 22px;line-height:1.75;' +
      'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;color:#1c1d1b;">' +
      '<div style="font-size:26px;font-weight:800;margin-bottom:14px;">页面没加载完整</div>' +
      '<p style="margin:0 0 14px;color:#4a4d48;">' + reason + '</p>' +
      '<div style="background:#fdf3dd;border-radius:12px;padding:14px 16px;font-size:14px;color:#6b5310;">' +
      '<b>怎么解决</b><br>1. 打开整个 <code>mba-study</code> 文件夹，不要只发 index.html；<br>' +
      '2. 或者在电脑上跑一个本地服务，手机连同一个 Wi-Fi 访问；<br>' +
      '3. 最简单：用我给你的在线地址，直接点开就能用。' +
      '</div></div>';
  }
  setTimeout(function () {
    var boot = document.querySelector('.boot');
    if (!boot) return;
    if (!window.MATH_CHAPTERS) fail('数据文件没有加载成功，所以没法开始。');
    else if (!document.getElementById('page')) fail('主程序没跑起来，可能是脚本被拦截了。');
    else fail('加载超时了，检查一下网络再刷新试试。');
  }, 2500);
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      fail('找不到文件：<code>' + (e.target.getAttribute('src') || '') + '</code>');
    }
  }, true);
})();
</script>
